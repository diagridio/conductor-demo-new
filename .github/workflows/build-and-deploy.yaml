name: CI/CD Pipeline

on:
  push:
    branches: [tidy-ci]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: development
    
    strategy:
      matrix:
        service:
          - loyalty-service
          - make-line-service
          - order-service
          - receipt-generation-service
          - virtual-customer
          - virtual-worker
          - order-processor-workflow
          - worker-actor
      fail-fast: false

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_DOCKER_REPOSITORY: ${{ secrets.GCP_DOCKER_REPOSITORY }}
      GCP_CONTAINER_REGISTRY_HOST: ${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set service configuration
        id: config
        run: |
          case "${{ matrix.service }}" in
            loyalty-service|make-line-service|order-service|receipt-generation-service|virtual-customer|virtual-worker)
              echo "working_dir=go/${{ matrix.service }}" >> $GITHUB_OUTPUT
              echo "image_name=order-system/${{ matrix.service }}" >> $GITHUB_OUTPUT
              ;;
            order-processor-workflow)
              echo "working_dir=dotnet/OrderProcessorWorkflow" >> $GITHUB_OUTPUT
              echo "image_name=order-system/order-processor-workflow" >> $GITHUB_OUTPUT
              ;;
            worker-actor)
              echo "working_dir=dotnet/WorkerActor" >> $GITHUB_OUTPUT
              echo "image_name=order-system/worker-actor" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_CONTAINER_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        working-directory: ${{ steps.config.outputs.working_dir }}
        run: |
          IMAGE_TAG="${{ env.GCP_CONTAINER_REGISTRY_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_DOCKER_REPOSITORY }}/${{ steps.config.outputs.image_name }}:${{ github.sha }}"
          
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_TAG}" \
            --push \
            .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: demo
    
    strategy:
      matrix:
        service:
          - loyalty-service
          #- make-line-service
          #- order-service
          #- receipt-generation-service
          #- virtual-customer
          #- virtual-worker
          #- order-processor-workflow
          #- worker-actor
        cluster:
          - staging
          #- free-tier
          #- enterprise
      fail-fast: false
      max-parallel: 6

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_DP_PROJECT_ID }}
      GKE_ZONE: ${{ vars.GCP_DP_GKE_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cluster configuration
        id: cluster
        run: |
          case "${{ matrix.cluster }}" in
            staging)
              echo "gke_cluster=${{ vars.GCP_DP_GKE_CLUSTER_NAME_0 }}" >> $GITHUB_OUTPUT
              ;;
            free-tier)
              echo "gke_cluster=${{ vars.GCP_DP_GKE_CLUSTER_NAME_1 }}" >> $GITHUB_OUTPUT
              ;;
            enterprise)
              echo "gke_cluster=${{ vars.GCP_DP_GKE_CLUSTER_NAME_2 }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set service configuration
        id: service
        run: |
          case "${{ matrix.service }}" in
            loyalty-service|make-line-service|order-service|receipt-generation-service|virtual-customer|virtual-worker)
              echo "image_name=order-system/${{ matrix.service }}" >> $GITHUB_OUTPUT
              echo "k8s_name=${{ matrix.service }}" >> $GITHUB_OUTPUT
              ;;
            order-processor-workflow)
              echo "image_name=order-system/order-processor-workflow" >> $GITHUB_OUTPUT
              echo "k8s_name=order-processor-workflow" >> $GITHUB_OUTPUT
              ;;
            worker-actor)
              echo "image_name=order-system/worker-actor" >> $GITHUB_OUTPUT
              echo "k8s_name=worker-actor" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Kustomize
        working-directory: ./deployment-files/
        run: |
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
          chmod u+x ./kustomize

      - name: Replace the target image name in the kustomization.yaml
        working-directory: ./deployment-files/
        run: |
          ./kustomize edit add resource ./k8s/${{ steps.service.outputs.k8s_name }}.yaml && ./kustomize edit set image ${{ steps.service.outputs.image_name }}:tag=us-central1-docker.pkg.dev/prj-common-d-shared-89549/reg-d-common-docker-public/${{ steps.service.outputs.image_name }}:${{ github.sha }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ steps.cluster.outputs.gke_cluster }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy to GKE
        working-directory: ./deployment-files
        run: |
          echo "Deploying ${{ matrix.service }} to ${{ matrix.cluster }} cluster..."
          kubectl apply -k . --timeout=300s
          
          # Wait for rollout to complete
          kubectl rollout status deployment/${{ steps.service.outputs.k8s_name }} --timeout=600s

      - name: Verify deployment
        run: |
          echo "Verifying deployment of ${{ matrix.service }} on ${{ matrix.cluster }}..."
          kubectl get deployment ${{ steps.service.outputs.k8s_name }} -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
          kubectl get pods -l app=${{ steps.service.outputs.k8s_name }} --no-headers | head -5