name: Build and Publish Loyalty Service

on:
  push:
    branches:
      - python-service
    paths:
      - 'go/loyalty-service/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'    
    environment: development
    env:
      GCP_PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      GCP_DOCKER_REPOSITORY: '${{ secrets.GCP_DOCKER_REPOSITORY }}'
      GCP_CONTAINER_REGISTRY_HOST: '${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}'
      IMAGE_NAME: order-system/loyalty-service
      TAG: 0.7.4

      GKE_CLUSTER: gke_prj-dataplane-n-demo-30534_us-west1-a_gke-n-dataplane-demo-us-west1-a2
      GKE_ZONE: us-west1-a
      DEPLOYMENT_NAME: loyalty-service


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'auth'
        name: Configure Google Credentials
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER}}
          service_account: ${{ secrets.SERVICE_ACCOUNT}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Docker Auth
        uses: 'docker/login-action@v3'
        with:
          registry: '${{ env.GCP_CONTAINER_REGISTRY_HOST }}'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          
      - name: Build and Push Docker Image (AMD, ARM)
        working-directory: go/loyalty-service
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t $GCP_CONTAINER_REGISTRY_HOST/$GCP_PROJECT_ID/$GCP_DOCKER_REPOSITORY/$IMAGE_NAME:$TAG . --push
    
      # Set up kustomize
      - name: Set up Kustomize
        run: |-
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
          chmod u+x ./kustomize

      # Deploy the Docker image to the GKE cluster    
      - name: Deploy to GKE
        run: |-
          ./kustomize edit set image gcr.io/PROJECT_ID/IMAGE:TAG=gcr.io/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment-files/$DEPLOYMENT_NAME
          kubectl get services -o wide
