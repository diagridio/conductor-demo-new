name: Build and Publish Loyalty Service

on:
  push:
    branches:
      - make-line-update
    paths:
      - 'go/loyalty-service/**'
  
  workflow_dispatch: # Manual trigger

env:
  PROJECT_ID: fake-app-323017
  REGION: northamerica-northeast1
  GAR_LOCATION: northamerica-northeast1-docker.pkg.dev/fake-app-323017/repo-1/

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install the gcloud cli
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          export_default_credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and Push Docker Image (AMD)
        env:
          GOOGLE_PROJECT: ${{ secrets.PROJECT_ID }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker buildx build --platform linux/amd64 -t us-central1-docker.pkg.dev/$GOOGLE_PROJECT/conductor-demo-registry/loyalty-service:latest . --push

      - name: Build and Push Docker Image (ARM)
        env:
          GOOGLE_PROJECT: ${{ secrets.PROJECT_ID }}
        run: |
          gcloud authe configure-docker us-central1-docker.pkg.dev
          docker buildx build --platform linux/arm64 -t us-central1-docker.pkg.dev/$GOOGLE_PROJECT/conductor-demo-registry/loyalty-service:latest . --push
