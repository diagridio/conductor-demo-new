 deploy-to-stg-cluster:
   runs-on: ubuntu-latest
   permissions:
     contents: 'read'
     id-token: 'write'    
   environment: demo
   env:
     GCP_PROJECT_ID: '${{ vars.GCP_DP_PROJECT_ID }}'
     GKE_CLUSTER: '${{ vars.GCP_DP_GKE_CLUSTER_NAME_0 }}'
     GKE_ZONE: '${{ vars.GCP_DP_GKE_ZONE }}'
 
   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - id: 'auth'
       name: Configure Google Credentials
       uses: google-github-actions/auth@v2
       with:
         token_format: 'access_token'
         workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
         service_account: ${{ vars.SERVICE_ACCOUNT}}
     
     - name: 'Set up Cloud SDK'
       uses: 'google-github-actions/setup-gcloud@v1'
       with:
         install_components: 'gke-gcloud-auth-plugin'

     - name: Get GKE credentials
       run: |
         gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GCP_PROJECT_ID

     - name: Deploy Redis Cleaner CronJob
       run: |
         kubectl apply -f ./deployment-files/k8s/redis-cleanup.yaml