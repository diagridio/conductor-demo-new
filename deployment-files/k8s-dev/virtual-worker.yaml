apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-worker
  namespace: order-system
  labels:
    app: virtual-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-worker
  template:
    metadata:
      labels:
        app: virtual-worker
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "virtual-worker"
        dapr.io/app-port: "80"
        dapr.io/config: "config"
        dapr.io/log-level: "debug"
        dapr.io/enable-app-health-check: "true" ## Flag indicating whether health check is enabled for app
        dapr.io/app-health-check-path: "/healthz" ## The healthcheck endpoint
        dapr.io/app-health-probe-interval: "5" ## The interval between calls to app health endpoint
        dapr.io/app-health-probe-timeout: "500" ## The timeout of the app health endpoint call
        dapr.io/app-health-threshold: "2" ## Threshold for considering app unhealthy
    spec:
      containers:
        - name: virtual-worker
          image: "us-central1-docker.pkg.dev/prj-common-d-shared-89549/reg-d-common-docker-public/order-system/virtual-worker:9bdc61701847441c4f345a84c2ff263cc1bf3b2e"
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            failureThreshold: 6
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            timeoutSeconds: 30
            successThreshold: 1
            failureThreshold: 12
            periodSeconds: 10
          env:
          - name: APP_PORT
            value: "80"
          - name: STORE_ID
            value: "Seattle"
          - name: MIN_SECONDS_TO_COMPLETE_ITEM
            value: "5"
          - name: MAX_SECONDS_TO_COMPLETE_ITEM
            value: "12"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1"