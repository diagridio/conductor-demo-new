apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-actor
  namespace: order-system
  labels:
    app: worker-actor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-actor
  template:
    metadata:
      labels:
        app: worker-actor
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "worker-actor"
        dapr.io/app-port: "8080"
        dapr.io/config: "config"
        dapr.io/actor-type: "WorkerActor"
    spec:
      containers:
        - name: worker-actor
          image: "us-central1-docker.pkg.dev/prj-common-d-shared-89549/reg-d-common-docker-public/order-system/worker-actor:03c6a4020bca09f7c45f933adbfe38c97d6b5371"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1"
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          