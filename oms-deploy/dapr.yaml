version: 1
apps:
  - appDirPath: ./../go/order-service/
    appID: order-service
    appPort: 5100
    appProtocol: http
    daprHTTPPort: 5180
    daprGRPCPort: 5101
    resourcesPaths:
      - ./../../components/local
    command: ["go", "run", "./cmd/api"]
  
  - appDirPath: ./../go/loyalty-service/
    appID: loyalty-service
    appPort: 5300
    appProtocol: http
    daprHTTPPort: 5380
    daprGRPCPort: 5301
    resourcesPaths:
      - ./../../components/local
    command: ["go", "run", "./cmd/api"]
  
  - appDirPath: ./../go/receipt-generation-service/
    appID: receipt-generation-service
    appPort: 5400
    appProtocol: http
    daprHTTPPort: 5480
    daprGRPCPort: 5401
    resourcesPaths:
      - ./../../components/local
    command: ["go", "run", "./cmd/api"]

  - appDirPath: ./../go/make-line-service/
    appID: make-line-service
    appPort: 5200
    appProtocol: http
    daprHTTPPort: 5280
    daprGRPCPort: 5201
    resourcesPaths:
      - ./../../components/local
    command: ["go", "run", "./cmd/api"]

  - appDirPath: ./../dotnet/OrderProcessorWorkflow/
    appID: order-processor-workflow
    appPort: 5700
    daprHTTPPort: 5780
    daprGRPCPort: 5701
    resourcesPaths:
      - ./../../components/local
    command: ["dotnet", "run"]
    appLogDestination: console
    daprdLogDestination: console
