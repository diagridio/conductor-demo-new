apiVersion: v1
kind: Service
metadata:
  name: make-line-service
  namespace: oms
  labels:
    name: make-line-service
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8082
    targetPort: 80
  selector:
    app: make-line-service
