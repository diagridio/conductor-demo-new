apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: loyalty-config
  namespace: order-system
spec:
  features:
  - name: HotReload
    enabled: true
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.zipkin.svc.cluster.local:9411/api/v2/spans"
    otel:
      endpointAddress: "jaeger-inmemory-instance-collector.observability.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true