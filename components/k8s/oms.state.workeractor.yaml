apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: oms.state.workeractor
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master.redis.svc.cluster.local:6379
  - name: redisPassword
    secretKeyRef:
      name: redis-password
      key: redis-password
  - name: actorStateStore
    value: "true"
  - name: ttlInSeconds
    value: "600"
scopes: 
  - worker-actor