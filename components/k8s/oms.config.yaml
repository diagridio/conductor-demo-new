apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: config
  namespace: order-system
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.zipkin.svc.cluster.local:9411/api/v2/spans"
    otel:
      endpointAddress: "jaeger-inmemory-instance-collector.observability.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
    http:
      pathMatching:
        - //v1.0/actors/WorkerActor/{ActorID}/reminders/MyReminder
        - //v1.0/actors/WorkerActor/{ActorID}/timers/MyTimer
    rules:
    - name: dapr_http_client_roundtrip_latency
      labels:
      - name: path
        regex:
          "orders/Seattle/ORDER_ID": "orders/Seattle/.+"
    - name: dapr_http_client_sent_bytes
      labels:
      - name: path
        regex:
          "orders/Seattle/ORDER_ID": "orders/Seattle/.+"
    - name: dapr_http_client_completed_count
      labels:
      - name: path
        regex:
          "orders/Seattle/ORDER_ID": "orders/Seattle/.+"
